# Laandet CI (laandet/docs/TEST_STRATEGY.md §6). Runs only when Laandet files change.
name: laandet-ci

on:
  pull_request:
    paths:
      - "laandet/**"
      - ".github/workflows/laandet-ci.yml"
  push:
    branches: [main]
    paths:
      - "laandet/**"
      - ".github/workflows/laandet-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laandet-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: laandet/app

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Local-only credentials for the throwaway CI database (created by scripts/db-setup-local.sh).
  TEST_DATABASE_URL: postgres://laandet_app:laandet_app_dev@localhost:5432/laandet_test
  TEST_DATABASE_MIGRATION_URL: postgres://laandet_owner:laandet_owner_dev@localhost:5432/laandet_test

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laandet/app/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laandet/app/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Database and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laandet/app/package-lock.json
      - run: npm ci
      - name: Create roles and databases
        run: sh scripts/db-setup-local.sh
      # Migrations, reference data and legal texts are applied by the test global setup.
      - run: npm run test:integration

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laandet/app/package-lock.json
      - run: npm ci
      - name: Create roles and databases
        run: sh scripts/db-setup-local.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            laandet/app/playwright-report
            laandet/app/test-results
          retention-days: 7

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laandet/app/package-lock.json
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
